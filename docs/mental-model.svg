<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-label="The mental model: one order line, two promises. A real line from supplier S2962 in Health and Beauty: ordered 14 May 2017; the supplier promised to hand it to the carrier by 18 May; it handed it over on 24 May, 6 days late, the same day the customer was promised delivery; the customer got it on 26 May, 2 days late. The line counts as in full, not on time, with a late hand-over. Across all delivered lines, 20.5 percent arrive late after a late hand-over against 5.2 percent after an on-time one.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#10213A"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
    .title { font-size: 21px; font-weight: 700; fill: #FFFFFF; }
    .sub { font-size: 13.5px; fill: #CBD5E1; }
    .event { font-size: 15px; font-weight: 700; fill: #FFFFFF; }
    .note { font-size: 12.5px; fill: #94A3B8; }
    .date { font-size: 13px; fill: #CBD5E1; }
    .gap { font-size: 14px; font-weight: 700; fill: #60A5FA; }
    .pill { font-size: 14px; fill: #E2E8F0; }
    .pillb { font-size: 14px; font-weight: 700; fill: #FFFFFF; }
    .cap { font-size: 12.5px; fill: #94A3B8; }
  </style>

  <rect width="1000" height="420" rx="22" fill="url(#bg)"/>
  <text x="50" y="52" class="title">The mental model: one order line, two promises</text>
  <text x="50" y="76" class="sub">A real line: supplier S2962, Health &amp; Beauty, May 2017. Every line in the scorecard is judged the same way.</text>

  <!-- supplier's gap (above) -->
  <path d="M330 128v10h360v-10" fill="none" stroke="#60A5FA" stroke-width="2"/>
  <text x="510" y="120" class="gap" text-anchor="middle">supplier's hand-over: 6 days late</text>

  <!-- timeline -->
  <line x1="80" y1="215" x2="900" y2="215" stroke="#475569" stroke-width="3"/>
  <line x1="330" y1="215" x2="690" y2="215" stroke="#60A5FA" stroke-width="3"/>
  <line x1="690" y1="215" x2="900" y2="215" stroke="#60A5FA" stroke-width="3" stroke-dasharray="6 5"/>

  <!-- 14 May: ordered -->
  <circle cx="80" cy="215" r="9" fill="#0B1220" stroke="#CBD5E1" stroke-width="3"/>
  <text x="80" y="180" class="event" text-anchor="middle">Ordered</text>
  <text x="80" y="245" class="date" text-anchor="middle">14 May</text>

  <!-- 18 May: hand-over deadline -->
  <circle cx="330" cy="215" r="9" fill="#0B1220" stroke="#CBD5E1" stroke-width="3"/>
  <text x="330" y="172" class="event" text-anchor="middle">Hand-over deadline</text>
  <text x="330" y="190" class="note" text-anchor="middle">the supplier's promise</text>
  <text x="330" y="245" class="date" text-anchor="middle">18 May</text>

  <!-- 24 May: handed over = promised to customer -->
  <circle cx="690" cy="215" r="9" fill="#60A5FA"/>
  <text x="690" y="172" class="event" text-anchor="middle">Handed to the carrier</text>
  <text x="690" y="190" class="note" text-anchor="middle">on the customer's promised day</text>
  <text x="690" y="245" class="date" text-anchor="middle">24 May</text>

  <!-- 26 May: delivered -->
  <circle cx="900" cy="215" r="9" fill="#60A5FA"/>
  <text x="900" y="180" class="event" text-anchor="middle">Delivered</text>
  <text x="900" y="245" class="date" text-anchor="middle">26 May</text>

  <!-- customer's gap (below) -->
  <path d="M690 262v10h210v-10" fill="none" stroke="#60A5FA" stroke-width="2"/>
  <text x="795" y="292" class="gap" text-anchor="middle">customer: 2 days late</text>

  <!-- the verdict -->
  <text x="50" y="290" class="note">How the scorecard counts this line</text>
  <rect x="50" y="305" width="190" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.06" stroke="#475569"/>
  <text x="145" y="330" class="pill" text-anchor="middle"><tspan class="pillb">In full:</tspan> yes, delivered</text>
  <rect x="255" y="305" width="250" height="40" rx="20" fill="#60A5FA" fill-opacity="0.15" stroke="#60A5FA"/>
  <text x="380" y="330" class="pill" text-anchor="middle"><tspan class="pillb">On time:</tspan> no, after 24 May</text>
  <rect x="520" y="305" width="250" height="40" rx="20" fill="#60A5FA" fill-opacity="0.15" stroke="#60A5FA"/>
  <text x="645" y="330" class="pill" text-anchor="middle"><tspan class="pillb">Late hand-over:</tspan> yes</text>

  <text x="50" y="380" class="cap">Across all delivered lines: after a late hand-over, 20.5% arrive late; after an on-time hand-over, 5.2%.</text>
  <text x="50" y="400" class="cap">29% of all late deliveries started with a late hand-over by the supplier.</text>
</svg>
