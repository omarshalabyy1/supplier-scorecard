<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-label="Supplier scorecard: on time, in full and late, by supplier and department. 29% of late deliveries started with a late hand-over by the supplier. A small scorecard shows two watch-list suppliers late on 19.4% and 16.3% of deliveries, the largest supplier at 5.1%, and all suppliers at 6.6%.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#10213A"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
      <radialGradient id="jrGlowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="jrGlowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#14B8A6" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    text { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
    .name { font-size: 34px; font-weight: 800; fill: #FFFFFF; }
    .tag { font-size: 16px; fill: #CBD5E1; }
    .result { font-size: 17px; font-weight: 700; fill: #60A5FA; }
    .th { font-size: 11.5px; font-weight: 700; letter-spacing: 0.6px; fill: #64748B; }
    .td { font-size: 13.5px; fill: #E2E8F0; }
    .flag { font-size: 11.5px; font-weight: 700; fill: #0B1220; }
      .wave { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 2 10; animation: flow 6s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -120; } }
  </style>

  <rect width="1000" height="260" rx="22" fill="url(#bg)"/>
  <circle cx="880" cy="60" r="190" fill="url(#jrGlowA)"/>
  <circle cx="160" cy="240" r="170" fill="url(#jrGlowB)"/>
  <path class="wave" stroke="#2DD4BF" stroke-opacity="0.5" d="M24 249 C 200 244, 330 253, 500 249 S 800 245, 976 249"/>
  <path class="wave" stroke="#A78BFA" stroke-opacity="0.4" style="animation-duration:9s" d="M40 255 C 220 251, 360 258, 520 255 S 820 252, 960 255"/>

  <text x="50" y="92" class="name">Supplier scorecard</text>
  <text x="50" y="124" class="tag">On time, in full and late, by supplier and department, in Power BI.</text>
  <text x="50" y="170" class="result">29% of late deliveries started with</text>
  <text x="50" y="194" class="result">a late hand-over by the supplier.</text>

  <!-- mini scorecard -->
  <rect x="560" y="40" width="390" height="180" rx="14" fill="#FFFFFF" fill-opacity="0.05" stroke="#334155"/>
  <text x="582" y="68" class="th">SUPPLIER</text>
  <text x="672" y="68" class="th">LATE RATE</text>

  <text x="582" y="102" class="td">S0082</text>
  <rect x="672" y="90" width="156" height="14" rx="4" fill="#60A5FA"/>
  <text x="836" y="102" class="td">19.4%</text>
  <rect x="884" y="89" width="50" height="17" rx="8" fill="#60A5FA"/>
  <text x="909" y="102" class="flag" text-anchor="middle">WATCH</text>

  <text x="582" y="136" class="td">S1670</text>
  <rect x="672" y="124" width="131" height="14" rx="4" fill="#60A5FA"/>
  <text x="811" y="136" class="td">16.3%</text>
  <rect x="884" y="123" width="50" height="17" rx="8" fill="#60A5FA"/>
  <text x="909" y="136" class="flag" text-anchor="middle">WATCH</text>

  <text x="582" y="170" class="td">S1236</text>
  <rect x="672" y="158" width="41" height="14" rx="4" fill="#64748B"/>
  <text x="721" y="170" class="td">5.1%</text>

  <line x1="582" y1="184" x2="928" y2="184" stroke="#334155"/>
  <text x="582" y="206" class="td">All suppliers</text>
  <rect x="672" y="194" width="53" height="14" rx="4" fill="#64748B"/>
  <text x="733" y="206" class="td">6.6%</text>
</svg>
