  <rect x="215" y="150" width="170" height="32" rx="7" fill="#13233D" stroke="#3B82F6" stroke-opacity="0.8"/><text x="225" y="171" class="name">orders</text><text x="377" y="171" class="count" text-anchor="end">99,441</text>
  <rect x="215" y="196" width="170" height="32" rx="7" fill="#13233D" stroke="#3B82F6" stroke-opacity="0.8"/><text x="225" y="217" class="name">order_items</text><text x="377" y="217" class="count" text-anchor="end">112,650</text>
  <rect x="215" y="242" width="170" height="32" rx="7" fill="#13233D" stroke="#3B82F6" stroke-opacity="0.8"/><text x="225" y="263" class="name">categories</text><text x="377" y="263" class="count" text-anchor="end">73</text>
  <rect x="215" y="288" width="170" height="32" rx="7" fill="#13233D" stroke="#3B82F6" stroke-opacity="0.8"/><text x="225" y="309" class="name">products</text><text x="377" y="309" class="count" text-anchor="end">32,951</text>
  <rect x="215" y="334" width="170" height="32" rx="7" fill="#13233D" stroke="#3B82F6" stroke-opacity="0.8"/><text x="225" y="355" class="name">sellers</text><text x="377" y="355" class="count" text-anchor="end">3,095</text>
  <rect x="215" y="380" width="170" height="32" rx="7" fill="#13233D" stroke="#3B82F6" stroke-opacity="0.8"/><text x="225" y="401" class="name">buyers</text><text x="377" y="401" class="count" text-anchor="end">10</text>
  <rect x="470" y="150" width="200" height="32" rx="7" fill="#13233D" stroke="#14B8A6" stroke-opacity="0.8"/><text x="480" y="171" class="name">dim_date</text><text x="662" y="171" class="count" text-anchor="end">774</text>
  <rect x="470" y="196" width="200" height="32" rx="7" fill="#13233D" stroke="#14B8A6" stroke-opacity="0.8"/><text x="480" y="217" class="name">fact_order_line</text><text x="662" y="217" class="count" text-anchor="end">112,650</text>
  <rect x="470" y="265.0" width="200" height="32" rx="7" fill="#13233D" stroke="#14B8A6" stroke-opacity="0.8"/><text x="480" y="286.0" class="name">dim_product</text><text x="662" y="286.0" class="count" text-anchor="end">32,951</text>
  <rect x="470" y="334" width="200" height="32" rx="7" fill="#13233D" stroke="#14B8A6" stroke-opacity="0.8"/><text x="480" y="355" class="name">dim_supplier</text><text x="662" y="355" class="count" text-anchor="end">3,095</text>
  <rect x="470" y="380" width="200" height="32" rx="7" fill="#13233D" stroke="#14B8A6" stroke-opacity="0.8"/><text x="480" y="401" class="name">buyer</text><text x="662" y="401" class="count" text-anchor="end">10</text>
  <rect x="470" y="449.0" width="200" height="32" rx="7" fill="#13233D" stroke="#14B8A6" stroke-opacity="0.8"/><text x="480" y="470.0" class="name">client_setting</text><text x="662" y="470.0" class="count" text-anchor="end">1</text>
  <rect x="470" y="495.0" width="200" height="32" rx="7" fill="#13233D" stroke="#14B8A6" stroke-opacity="0.8"/><text x="480" y="516.0" class="name">weekly_summary</text><text x="662" y="516.0" class="count" text-anchor="end">11</text>
