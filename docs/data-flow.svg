<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 609" width="1000" height="609" role="img" aria-label="Data flow, table by table: 6 input files load into 6 raw tables (orders 99,441, order_items 112,650, categories 73, products 32,951, sellers 3,095, buyers 10 rows). The star schema builds fact_order_line (112,650 rows) from order items and orders, taking its keys from dim_supplier (3,095) and dim_product (32,951, with category and department), plus dim_date (774 days) and buyer (10). The rules in config/client.yaml become client_setting (1 row), and summarize.py, with a local llama3.2 model, writes weekly_summary (11 rows). Power BI reads the star schema into four pages and a Buyer role.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#10213A"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748B"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
    .title { font-size: 21px; font-weight: 700; fill: #FFFFFF; }
    .sub { font-size: 13.5px; fill: #CBD5E1; }
    .layer { font-size: 14px; font-weight: 700; fill: #0B1220; }
    .where { font-size: 12px; fill: #94A3B8; }
    .name { font-size: 13px; fill: #F1F5F9; }
    .count { font-size: 11.5px; fill: #94A3B8; }
    .col { font-size: 12.5px; fill: #E2E8F0; }
    .key { font-size: 11px; font-weight: 700; }
    .edge { fill: none; stroke: #64748B; stroke-width: 1.4; }
  </style>
  <rect width="1000" height="609" rx="22" fill="url(#bg)"/>
  <text x="40" y="50" class="title">Data flow, table by table</text>
  <text x="40" y="74" class="sub">Every table in the warehouse and the tables it is built from. load.py fills raw and builds the star schema in one transaction.</text>
  <rect x="30" y="96" width="140" height="26" rx="13" fill="#94A3B8"/><text x="100.0" y="114" class="layer" text-anchor="middle">Input files</text>
  <text x="100.0" y="138" class="where" text-anchor="middle">data/input, config</text>
  <rect x="215" y="96" width="170" height="26" rx="13" fill="#3B82F6"/><text x="300.0" y="114" class="layer" text-anchor="middle">1  Raw</text>
  <text x="300.0" y="138" class="where" text-anchor="middle">schema raw, tables</text>
  <rect x="470" y="96" width="200" height="26" rx="13" fill="#14B8A6"/><text x="570.0" y="114" class="layer" text-anchor="middle">2  Star schema</text>
  <text x="570.0" y="138" class="where" text-anchor="middle">schema star, tables</text>
  <rect x="825" y="96" width="145" height="26" rx="13" fill="#22C55E"/><text x="897.5" y="114" class="layer" text-anchor="middle">3  Power BI</text>
  <text x="897.5" y="138" class="where" text-anchor="middle">reads schema star</text>
  <rect x="30" y="150" width="140" height="262" rx="10" fill="#13233D" stroke="#94A3B8" stroke-opacity="0.7"/>
  <text x="44" y="212" class="name" font-weight="700">6 CSV files</text>
  <text x="44" y="232" class="count" style="fill:#CBD5E1;font-size:12.5px"></text>
  <text x="44" y="252" class="count" style="fill:#CBD5E1;font-size:12.5px">4 order exports:</text>
  <text x="44" y="272" class="count" style="fill:#CBD5E1;font-size:12.5px">orders, order items,</text>
  <text x="44" y="292" class="count" style="fill:#CBD5E1;font-size:12.5px">products, sellers</text>
  <text x="44" y="312" class="count" style="fill:#CBD5E1;font-size:12.5px"></text>
  <text x="44" y="332" class="count" style="fill:#CBD5E1;font-size:12.5px">+ categories.csv</text>
  <text x="44" y="352" class="count" style="fill:#CBD5E1;font-size:12.5px">+ buyers.csv</text>
